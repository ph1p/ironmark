name: Deploy Playground

on:
  push:
    branches:
      - "chore/**"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - uses: ./.github/actions/setup-wasm

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: playground/pnpm-lock.yaml

      # prebuild runs the root `pnpm build` (WASM + Node.js entry)
      - name: Install & build playground
        run: |
          cd playground
          pnpm install --frozen-lockfile
          BASE_URL=/ironmark/ pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
