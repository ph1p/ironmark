name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - name: Check feature combinations
        run: |
          for f in "" html ansi html-parser serde; do
            RUSTFLAGS="-D warnings" cargo check --lib --no-default-features --features "$f"
          done

  lint:
    name: Lint & Format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm oxlint
      - run: pnpm oxfmt --check .
      - name: Test measurement tools (no performance thresholds)
        run: node --test benchmark/measure.test.mjs benchmark/api.test.mjs

  wasm:
    name: WASM
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-wasm

      - name: Build WASM
        run: pnpm build

      - name: Test built WASM adapter and package
        run: node --test wasm/api.test.mjs wasm/package.test.mjs
