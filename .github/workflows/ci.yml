name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - name: Check feature combinations
        run: |
          for f in "" html ansi html-parser serde; do
            RUSTFLAGS="-D warnings" cargo check --lib --no-default-features --features "$f"
          done
      - name: C API smoke test
        run: |
          cargo build
          cc -std=c99 -Wall -Wextra -Werror -o smoke tests/c/smoke.c \
            target/debug/libironmark.a -lpthread -ldl -lm
          ./smoke

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Seed corpora from the CommonMark spec
        run: node fuzz/seed.mjs
      - name: Run each target for 30 s
        run: |
          for t in render_html url_sanitize ast_roundtrip html_to_markdown render_ansi; do
            cargo fuzz run -O "$t" -- -max_total_time=30 -max_len=4096 -timeout=5 -dict=fuzz/markdown.dict
          done
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  lint:
    name: Lint & Format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm oxlint
      - run: pnpm oxfmt --check .
      - name: Type-check the published .d.ts files
        run: pnpm test:types
      - name: Test measurement tools (no performance thresholds)
        run: node --test benchmark/measure.test.mjs benchmark/api.test.mjs

  wasm:
    name: WASM
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-wasm

      - name: Build WASM
        run: pnpm build

      - name: Test built WASM adapter and package
        run: node --test wasm/api.test.mjs wasm/package.test.mjs
