[package]
name = "ironmark-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = true

[lib]
name = "ironmark"
crate-type = ["cdylib"]

[features]
default = ["full"]
full = ["html-only", "ironmark/serde", "ironmark/ansi", "ironmark/html-parser", "dep:serde_json"]
html-only = ["ironmark/html"]

[dependencies]
ironmark = { path = "..", default-features = false }
serde_json = { version = "1", optional = true }
wasm-bindgen = "0.2.129"
