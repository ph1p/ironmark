[package]
name = "ironmark-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = true

[lib]
name = "ironmark"
crate-type = ["cdylib"]

[features]
# One feature per npm subpath, so each entry can ship a WASM binary with only what it calls.
default = ["full"]
full = ["ast", "ansi", "mdx", "html-parser"]
html-only = ["ironmark/html"]
ast = ["html-only", "ironmark/serde", "dep:serde_json"]
ansi = ["html-only", "ironmark/ansi"]
mdx = ["html-only"]
html-parser = ["ast", "ironmark/html-parser"]

[dependencies]
ironmark = { path = "..", default-features = false }
serde_json = { version = "1", optional = true }
wasm-bindgen = "=0.2.129"
